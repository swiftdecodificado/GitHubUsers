name: Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  HOMEBREW_NO_AUTO_UPDATE: "1"

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Unit tests and iOS builds
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Test ViewModels
        run: swift test

      - name: Test GitHubAPI
        run: swift test --package-path Packages/GitHubAPI

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen version
          xcodegen generate --spec project.yml

      # Compiles the app and both iOS test targets without booting a simulator.
      - name: Build Debug app and test bundles
        run: |
          xcodebuild build-for-testing \
            -project GitHubUsers.xcodeproj \
            -scheme GitHubUsers \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Release app
        run: |
          xcodebuild build \
            -project GitHubUsers.xcodeproj \
            -scheme GitHubUsers \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
